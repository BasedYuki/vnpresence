name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test before shipping
        run: pytest -q

      # tools/entry.py, never src/vnpresence/__main__.py: a frozen entry script
      # runs standalone, so relative imports inside the package would break it.
      - name: Build VNPresence.exe (windowed)
        run: >
          pyinstaller --onefile --windowed --name VNPresence
          --icon assets/icon.ico
          --paths src --collect-submodules vnpresence
          tools/entry.py

      - name: Build VNPresence-cli.exe (console, for doctor/watch output)
        run: >
          pyinstaller --onefile --console --name VNPresence-cli
          --icon assets/icon.ico
          --paths src --collect-submodules vnpresence
          tools/entry.py

      # A frozen build can fail at import time while the tests all pass, so
      # prove the real .exe runs before it is published.
      - name: Smoke-test the build
        run: |
          .\dist\VNPresence-cli.exe --version
          .\dist\VNPresence-cli.exe --help
          .\dist\VNPresence-cli.exe status

      - uses: actions/upload-artifact@v4
        with:
          name: VNPresence-windows
          path: |
            dist/VNPresence.exe
            dist/VNPresence-cli.exe

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/VNPresence.exe
            dist/VNPresence-cli.exe
          generate_release_notes: true
