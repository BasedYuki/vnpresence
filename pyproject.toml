[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vnpresence"
dynamic = ["version"]
description = "Discord Rich Presence for visual novels - launch a VN and show it on your profile"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = ["discord", "rich-presence", "visual-novel", "vndb", "rpc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "pypresence>=4.3.0",
    "psutil>=5.9",
    "PyYAML>=6.0",
    "requests>=2.28",
    "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5", "pyinstaller>=6.0"]

[project.urls]
Homepage = "https://github.com/BasedYuki/vnpresence"
Issues = "https://github.com/BasedYuki/vnpresence/issues"

[project.scripts]
vnpresence = "vnpresence.cli:main"

[project.gui-scripts]
vnpresence-gui = "vnpresence.gui:run_gui"

[tool.hatch.version]
path = "src/vnpresence/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vnpresence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]
